name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Test
        run: swift test
      - name: Build app (ad-hoc signed)
        run: VERSION=0.0.0 ./scripts/build-app.sh
      - name: Check bundle
        run: |
          plutil -lint build/LimitsBar.app/Contents/Info.plist
          test -d build/LimitsBar.app/Contents/Frameworks/Sparkle.framework
          ls build/LimitsBar.app/Contents/Resources | grep -c lproj
          codesign --verify --deep --strict build/LimitsBar.app
