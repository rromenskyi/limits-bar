name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Pinned to the Xcode 26 line (Swift 6.2) rather than whatever is newest on the image.
        run: |
          X="$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)"
          [[ -n "$X" ]] || { echo "error: no Xcode 26 on the runner" >&2; exit 1; }
          sudo xcode-select -s "$X"
          swift --version
      - name: Test
        run: swift test
      - name: Build app (ad-hoc signed)
        run: VERSION=0.0.0 ./scripts/build-app.sh
      - name: Check bundle
        run: |
          APP=build/LimitsBar.app
          plutil -lint "$APP/Contents/Info.plist"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/LICENSE"
          diff THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md" \
            || { echo "error: THIRD_PARTY_NOTICES.md is stale; run ./scripts/make-notices.sh > THIRD_PARTY_NOTICES.md" >&2; exit 1; }
          want="$(ls -d Resources/Localization/*.lproj | wc -l | tr -d ' ')"
          have="$(ls -d "$APP"/Contents/Resources/*.lproj | wc -l | tr -d ' ')"
          [[ "$have" == "$want" ]] || { echo "error: $have of $want localizations bundled" >&2; exit 1; }
          lipo -info "$APP/Contents/MacOS/LimitsBar" | grep -q "x86_64 arm64\|arm64 x86_64"
          lipo -info "$APP/Contents/Frameworks/Sparkle.framework/Sparkle" | grep -q "x86_64 arm64\|arm64 x86_64"
          codesign --verify --deep --strict "$APP"
